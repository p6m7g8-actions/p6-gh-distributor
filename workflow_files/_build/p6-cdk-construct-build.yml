name: Build

on:
  pull_request: {}
  # The merge queue needs `build` to report on the queue ref.
  # merge_group alone was not dispatching, so mirror the
  # push-on-queue-ref trigger the review workflows already use.
  push:
    branches:
      - gh-readonly-queue/**
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # p6-cdk-construct-build declares no required inputs; aws_role,
      # aws_session_name, cdk_deploy_account and cdk_deploy_region are all
      # optional, so no per-repo configuration is needed here.
      - name: CDK Construct Build
        uses: p6m7g8-actions/p6-cdk-construct-build@main
