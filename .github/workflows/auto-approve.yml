name: auto-approve

on:
  pull_request_target:
    types:
      - labeled
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  approve:
    runs-on: ubuntu-latest
    name: Auto-Approve PR
    permissions:
      pull-requests: write
    steps:
      # NOTE: `uses: ./` here resolved to THIS repo's own action, the distributor,
      # so every pull_request_target ran a full 6-org distribution. It only ever
      # failed at git push because `bot_token` is not a distributor input, so no
      # PAT was set. Do NOT "fix" this by renaming the input to gh_token.
      - name: Auto-Approve PR
        uses: p6m7g8-actions/p6-gh-pr-auto-approve@main
        with:
          bot_token: ${{ secrets.P6_A_GH_TOKEN }}
