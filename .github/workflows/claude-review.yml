name: Claude Code Review

on:
  # `reopened` is load-bearing. The fleet's signed-commit upgrade PRs are
  # raised under GITHUB_TOKEN, which does not dispatch workflows, so the
  # `gh pr close` + `gh pr reopen` revival is the only event this workflow
  # ever sees on them. Omitting it leaves `claude-review`, a required
  # check, permanently unreported. Full history is in
  # workflow_files/common/claude-review.yml.
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
  # merge_group is not dispatching, so report on the queue ref via push.
  # This repo is excluded from its own distribution, which is why its pack
  # drifted behind the fleet's current generation.
  push:
    branches:
      - gh-readonly-queue/**
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  # event_name is part of the key on purpose. A `push` to a
  # gh-readonly-queue ref and a `merge_group` on that same ref both leave
  # `github.event.pull_request.number` empty and both resolve `github.ref`
  # to the queue ref, so without it the two share a group and
  # cancel-in-progress cancels one of them. A cancelled required check
  # dequeues the PR. Same key construction as
  # workflow_files/p6m7g8-actions/build.yml, folded only to stay under 80
  # columns.
  group: >-
    claude-${{ github.event_name }}-${{
    github.event.pull_request.number || github.ref }}
  # Only PR runs are cancellable. A cancelled required check dequeues the
  # PR, so a run on a queue ref must never be superseded by anything.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  claude-review:
    name: claude-review
    runs-on: ubuntu-latest
    steps:
      - name: Skip in merge queue context
        if: github.event_name == 'merge_group'
        run: echo "Skipping AI PR review in merge queue context."
      - name: Run claude review
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        continue-on-error: true
        uses: p6m7g8-actions/claude@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
