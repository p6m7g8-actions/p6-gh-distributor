name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # The merge queue needs `build` and `Lint PR title` to report on the
  # queue ref. merge_group alone was not dispatching, so mirror the
  # push-on-queue-ref trigger the review workflows already use.
  push:
    branches:
      - gh-readonly-queue/**
  merge_group:
    types: [checks_requested]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  # A `push` to a gh-readonly-queue ref and a `merge_group` on that same
  # ref both leave `github.event.pull_request.number` empty and both
  # resolve `github.ref` to the queue ref, so they otherwise share one
  # group. event_name in the key separates exactly those two, and nothing
  # more: it does NOT separate `reopened` from `synchronize`, since both
  # arrive as `pull_request`. Same construction as
  # workflow_files/p6m7g8-actions/build.yml, folded only to stay under 80
  # columns.
  group: >-
    build-${{ github.event_name }}-${{
    github.event.pull_request.number || github.ref }}
  # This is the line that prevents a dequeue. Only `pull_request` runs are
  # cancellable, so a queue-ref build can never be superseded, and a
  # cancelled required check can therefore never dequeue the PR. This
  # workflow deliberately runs the FULL build on queue refs, so it is the
  # one that most needs the guarantee.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Build
        uses: p6m7g8-actions/p6-build@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}

  lint_pr_title:
    name: Lint PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Skip PR title lint in merge queue context
        if: github.event_name == 'merge_group'
        run: echo "No PR title in merge_group event; marking check successful."
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        uses: p6m7g8-actions/p6-gh-pr-title-linter@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
