name: Smoke
on:
  workflow_dispatch: {}
  # Deliberately NO paths filter. Smoke is not a required check today, but if it
  # becomes one a filtered trigger would leave a docs-only PR stuck at
  # "Expected -- waiting for status" forever, which matters in a repo that drives
  # everything through auto-merge. The job costs about a second.
  pull_request: {}
  push:
    branches:
      - gh-readonly-queue/**
jobs:
  smoke:
    runs-on: ubuntu-latest
    name: Smoke
    steps:
      - name: Checkout
        uses: p6m7g8-actions/gh-repo-checkout@main

      # Guards the startup validation of workflow_files/<org>/build.yml. It runs
      # before any repo is cloned, so an empty target list exercises it with no
      # token and no network -- which is the only reason this is testable at all.
      #
      # This exists because a template that resolves to zero or two build actions
      # would otherwise silently stop build.yml reaching every target in that org,
      # emitting per-target notices that blame the targets.
      - name: Pack validation
        shell: bash
        run: ./test/pack-validation.sh

      - name: Shellcheck
        shell: bash
        run: shellcheck bin/*.sh test/*.sh
